spring.application.name=baozi-store

# Banco relacional H2 (em memoria, sem instalar nada)
spring.datasource.url=jdbc:h2:mem:baozidb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Datas em formato ISO (yyyy-MM-dd) no JSON
spring.jackson.serialization.write-dates-as-timestamps=false
